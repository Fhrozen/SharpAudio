// wiki: asr-engines#worker-process-di-wiring-and-server-mode
syntax = "proto3";

option csharp_namespace = "SharpAudio.Worker.Asr.Grpc";

package transcription;

// Service for ASR transcription operations running in the ASR worker process
service WorkerTranscription {
  // Transcribe audio to text
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);

  // Bidirectional streaming transcription: client sends a one-time config chunk followed by raw
  // PCM16 mono audio chunks, server replies with the transcript-so-far as it becomes available.
  rpc TranscribeStream(stream TranscribeStreamChunk) returns (stream TranscribeStreamUpdate);

  // Health check for worker readiness
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// Request message for transcription
message TranscribeRequest {
  // Model configuration
  string model_name = 1;
  string engine = 2;
  string model_path = 3;

  // Transcription parameters
  bytes audio_bytes = 10;
  string audio_format = 11;
  string language = 12;

  // VAD and segment options
  bool use_vad = 20;
  float vad_onset = 21;
  float vad_offset = 22;
  bool include_segments = 23;
  double min_segment_duration_seconds = 24;

  // Punctuation / capitalisation post-processing applied after transcription
  bool punctuate = 25;
  string pnc_model_name = 26;
  string pnc_model_directory = 27;
}

// Response message for transcription
message TranscribeResponse {
  string text = 1;
  string language_detected = 2;
  double processing_time_seconds = 3;
  double audio_duration_seconds = 4;
  repeated TranscriptionSegmentProto segments = 5;
}

// One timestamped segment, span-local timestamps are already shifted to audio time
message TranscriptionSegmentProto {
  int32 id = 1;
  double start = 2;
  double end = 3;
  string text = 4;
}

// One message in a TranscribeStream call - the first message on a call must set `config`; every
// subsequent message carries a raw PCM16 mono audio chunk instead.
message TranscribeStreamChunk {
  oneof payload {
    StreamConfig config = 1;
    bytes audio_chunk = 2;
  }
}

// One-time stream configuration, sent as the first TranscribeStreamChunk on a call.
message StreamConfig {
  string model_name = 1;
  string engine = 2;
  string model_path = 3;
  string language = 4;
  bool use_vad = 5;
  double segment_seconds = 6;
  bool enable_endpointing = 7;
  double stop_history_eou_ms = 8;
}

// One incremental transcription update - text is scoped to the CURRENT segment only (never the
// whole conversation), keeping every message bounded in size regardless of utterance length.
message TranscribeStreamUpdate {
  string text = 1;
  bool is_final = 2;
  bool is_segment_final = 3;
  bool is_endpoint_final = 4;
}

// Health check request
message HealthCheckRequest {
}

// Health check response
message HealthCheckResponse {
  bool is_ready = 1;
  string model_loaded = 2;
  double idle_seconds = 3;
}
