// wiki: music#grpc-contract
syntax = "proto3";

import "Protos/common.proto";

option csharp_namespace = "SharpAudio.Worker.Music.Grpc";

package music;

// Service for music generation running in the music worker process.
service WorkerMusic {
  // Generate audio from a text prompt.
  rpc Generate(GenerateRequest) returns (GenerateResponse);

  // Health check for worker readiness.
  rpc HealthCheck(health.HealthCheckRequest) returns (health.HealthCheckResponse);
}

// Request message for music generation.
message GenerateRequest {
  // Model configuration
  string model_name = 1;
  string engine = 2;
  string model_path = 3;

  // Generation parameters
  string prompt = 10;
  string negative_prompt = 11;
  int32 duration_seconds = 12;
  int32 steps = 13;
  int64 seed = 14;
}

// Response message for music generation
message GenerateResponse {
  bytes audio_bytes = 1;
  string content_type = 2;
  string file_name = 3;
  int32 sample_rate = 4;
  int32 channels = 5;
  double processing_time_seconds = 6;
  double audio_duration_seconds = 7;
}
