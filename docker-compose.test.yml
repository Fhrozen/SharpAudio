services:
  # Main application service for integration testing
  sharp-audio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MODEL_CACHE_DIR: /cache
      ESPEAK_DATA_DIR: /app/assets/espeak-ng-data
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./model-cache:/cache
      - ./assets:/app/assets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Integration test runner
  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      MODEL_CACHE_DIR: /cache
      ESPEAK_DATA_DIR: /app/assets/espeak-ng-data
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./model-cache:/cache
      - ./assets:/app/assets:ro
      - ./test-results:/src/test-results
    depends_on:
      sharp-audio:
        condition: service_healthy
    profiles:
      - test

  # Unit test runner (doesn't need the app running)
  unit-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    command: ["tests/SharpAudio.Api.Tests/SharpAudio.Api.Tests.csproj"]
    volumes:
      - ./test-results:/src/test-results
    profiles:
      - test

  # CI build step: compiles Core + Api + every worker executable + the benchmark project
  # from the solution file, so a project that is not covered by the test runs still fails CI.
  build:
    build:
      context: .
      dockerfile: Dockerfile.tests
    entrypoint: ["dotnet", "build"]
    command: ["SharpAudio.slnx", "--no-incremental"]
    volumes:
      - ./test-results:/src/test-results
    profiles:
      - test

  # Optional benchmark category (BenchmarkDotNet); not part of `all`.
  benchmarks:
    build:
      context: .
      dockerfile: Dockerfile.tests
    entrypoint: ["dotnet", "run", "--project", "tests/SharpAudio.Api.Benchmarks", "-c", "Release"]
    command: ["--", "--filter", "${BENCHMARK_FILTER:-*}"]
    environment:
      MODEL_CACHE_DIR: /cache
    volumes:
      - ./model-cache:/cache
      - ./test-results:/src/test-results
    profiles:
      - test

  # Opt-in ASR/TTS circular model tests - self-hosts the app in-process (WebApplicationFactory),
  # so it does NOT depend on the `sharp-audio` service. Downloads real TTS+ASR models; skipped by
  # default (ASR_MODEL_TESTS unset) and excluded from CI - see docs/ASR_IMPLEMENTATION_PLAN.md.
  asr-model-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    command: ["tests/SharpAudio.Api.IntegrationTests/SharpAudio.Api.IntegrationTests.csproj", "--filter", "Category=AsrModelTests"]
    environment:
      ASR_MODEL_TESTS: "1"
      MODEL_CACHE_DIR: /cache
    volumes:
      - ./model-cache:/cache
      - ./test-results:/src/test-results
    profiles:
      - test

volumes:
  model-cache:
