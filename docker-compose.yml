services:
  sharp-audio:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   target: runtime-all   # or runtime-tts / runtime-asr for a smaller single-purpose image
    image: fhrozen/sharp-audio:audio-latest
    ports:
      - "${HOST_PORT:-5768}:${HTTP_PORT:-5768}"
      - "${HOST_HTTPS_PORT:-5769}:${HTTPS_PORT:-5769}"
    environment:
      HTTP_PORT: ${HTTP_PORT:-5768}
      HTTPS_PORT: ${HTTPS_PORT:-}
      SERVER_MODE: ${SERVER_MODE:-both}
      MODEL_CACHE_DIR: /cache
      ESPEAK_DATA_DIR: /app/assets/espeak-ng-data
      MODEL_IDLE_TIMEOUT_SECONDS: ${MODEL_IDLE_TIMEOUT_SECONDS:-60}
      AsrWorkerOptions__Enabled: ${AsrWorkerOptions__Enabled:-true}
      AsrWorkerOptions__PortRangeStart: ${AsrWorkerOptions__PortRangeStart:-50151}
      AsrWorkerOptions__IdleTimeoutSeconds: ${AsrWorkerOptions__IdleTimeoutSeconds:-60}
      MusicWorkerOptions__PortRangeStart: ${MusicWorkerOptions__PortRangeStart:-50251}
      MusicWorkerOptions__IdleTimeoutSeconds: ${MusicWorkerOptions__IdleTimeoutSeconds:-60}
      DiarWorkerOptions__PortRangeStart: ${DiarWorkerOptions__PortRangeStart:-50351}
      DiarWorkerOptions__IdleTimeoutSeconds: ${DiarWorkerOptions__IdleTimeoutSeconds:-60}
      # Kestrel's built-in default-certificate loader - only used when HTTPS_PORT is set. Generate
      # a cert first with ./generate-cert.sh <your-lan-hostname-or-ip>.
      Kestrel__Certificates__Default__Path: /certs/sharp-audio.pfx
      Kestrel__Certificates__Default__Password: ${CERT_PASSWORD:-}
    env_file:
      - .env
    volumes:
      - ./model-cache:/cache
      - ./assets:/app/assets:ro
      - ./certs:/certs:ro

  # Example: TTS-only deployment, built locally from a smaller image variant.
  # sharp-audio-tts:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: runtime-tts
  #   ports:
  #     - "5768:8080"
  #   environment:
  #     SERVER_MODE: tts
  #   volumes:
  #     - ./model-cache:/cache
  #     - ./assets:/app/assets:ro

  # Example: ASR-only deployment, built locally from a smaller image variant.
  # sharp-audio-asr:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: runtime-asr
  #   ports:
