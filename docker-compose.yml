  #   environment:
  #     SERVER_MODE: asr
  #   volumes:
  #     - ./model-cache:/cache
  #     - ./assets:/app/assets:ro

  # Example: music-only deployment (Stable Audio), built locally from a smaller image variant.
  # sharp-audio-music:
